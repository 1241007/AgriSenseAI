[project]
name = "agriai-backend"
version = "0.1.0"
description = "AgriAI Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.3",
    "pydantic-settings>=2.3.4",
    "redis>=5.0.7",
    "alembic>=1.13.2",
    "structlog>=24.2.0",
    "email-validator>=2.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
